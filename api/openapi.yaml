    BoardList: { type: object, additionalProperties: false, required: [items, truncated], properties: { items: { type: array, items: { $ref: '#/components/schemas/BoardSummary' } }, truncated: { type: boolean } } }
    BoardCreate: { type: object, additionalProperties: false, required: [spec], properties: { spec: { allOf: [ { $ref: '#/components/schemas/BoardSpec' } ], x-go-type: json.RawMessage } } }
    BoardUpdate: { type: object, additionalProperties: false, required: [spec], properties: { spec: { allOf: [ { $ref: '#/components/schemas/BoardSpec' } ], x-go-type: json.RawMessage }, message: { type: string, maxLength: 500 } } }
    BoardSaveResult: { type: object, additionalProperties: false, required: [board, changed], properties: { board: { $ref: '#/components/schemas/Board' }, changed: { type: boolean } } }
    BoardConflict: { type: object, additionalProperties: false, required: [error, current], properties: { error: { $ref: '#/components/schemas/ErrorBody' }, current: { $ref: '#/components/schemas/Board' }, submitted: { allOf: [ { $ref: '#/components/schemas/BoardSpec' } ], x-go-type: json.RawMessage } } }
    BoardRef: { type: object, additionalProperties: false, required: [uid, title], properties: { uid: { type: string }, title: { type: string } } }
    BoardRefList: { type: object, additionalProperties: false, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/BoardRef' } } } }
