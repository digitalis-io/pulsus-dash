    Vis: { type: object, additionalProperties: false, required: [kind], properties: { kind: { type: string, enum: [auto, line, bars, heatmap, stat, logs] } } }
    Author: { type: object, additionalProperties: false, required: [kind, name], properties: { kind: { type: string, enum: [local] }, name: { type: string } } }
    BoardSummary:
