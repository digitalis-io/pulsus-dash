[package]
name = "xtask"
description = "Workspace tooling: CI gates (`cargo xtask ci <gate>`) and gate-proof seeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
sha2 = "0.10"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
brotli = "9"
glob = "0.3"
tempfile = "3"

[lints]
workspace = true
