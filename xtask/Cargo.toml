[package]
name = "xtask"
description = "Workspace tooling: CI gates (`cargo xtask ci <gate>`), gate-proof seeds, build tools, artefact generation and the dev server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
regex = "1"
sha2 = "0.10"
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
brotli = "9"
glob = "0.3"
tempfile = "3"
dash-protocol.workspace = true
dash-lab.workspace = true
tiny_http = "0.12.0"
wasmparser = "0.263.0"
bcrypt = "0.19"
getrandom = "0.3"
serde_norway = "0.9"
url = "2"

[dev-dependencies]
wasm-encoder = "0.263.0"

[lints]
workspace = true
