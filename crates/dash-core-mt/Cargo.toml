[package]
name = "dash-core-mt"
description = "Core WASM module: the render and data workers (T03 §4.1). Built twice: dash-core-mt (+atomics, shared memory) and dash-core-st (own memory)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
probe = [] # test probe `self.__dashProbe` and `?fault=` injection (T03-024: never in release builds)

[dependencies]
arc-swap.workspace = true
bytemuck.workspace = true
dash-axes.workspace = true
dash-gpu.workspace = true
dash-marks.workspace = true
dash-protocol.workspace = true
dash-scales.workspace = true
dash-scene.workspace = true
dash-tokens.workspace = true
dash-wire.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["OffscreenCanvas", "Performance"] }
wgpu.workspace = true

[lints]
workspace = true
