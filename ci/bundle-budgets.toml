# ci/bundle-budgets.toml — T03 §7.3, brotli bytes, 1 KB = 1000 bytes.
# Generated output layout: web/shim/gen/<crate>/ holds <crate_>.js glue, <crate_>_bg.wasm and snippets/.
mode = "enforce" # "enforce" with the first real bundle (T05 §7.1)
eager_total_bytes = 2_600_000

artefact = [ # same as [[artefact]] tables; keys as ArtefactBudget
  { name = "shim", t03_row = "shim (all files)", files = ["web/shim/**/*.js", "web/shim/**/*.mjs", "web/shim/**/*.cjs"],
    exclude = ["web/shim/gen/**"], budget_bytes = 8_000, eager = true },
  { name = "dash-shell", t03_row = "`dash-shell.wasm` + glue", files = ["web/shim/gen/dash-shell/**/*"], budget_bytes = 700_000, eager = true },
  { name = "dash-core-mt", t03_row = "`dash-core-mt.wasm` + glue", files = ["web/shim/gen/dash-core-mt/**/*"], budget_bytes = 1_900_000, eager = true },
  { name = "msdf-atlases-latin", t03_row = "MSDF atlases (Inter + JetBrains Mono, Latin)", files = ["web/assets/msdf/latin/**/*"], budget_bytes = 250_000, eager = false },
  { name = "dash-editor", t03_row = "`dash-editor.wasm`", files = ["web/shim/gen/dash-editor/**/*"], budget_bytes = 600_000, eager = false },
  { name = "dash-rooms-admin", t03_row = "`dash-rooms-admin.wasm`", files = ["web/shim/gen/dash-rooms-admin/**/*"], budget_bytes = 500_000, eager = false },
  { name = "dash-geo", t03_row = "`dash-geo.wasm`", files = ["web/shim/gen/dash-geo/**/*"], budget_bytes = 800_000, eager = false },
  { name = "workbench-satellite", t03_row = "Each workbench satellite", instances = "web/shim/gen/dash-wb-*", files = ["**/*"], budget_bytes = 400_000, eager = false },
  { name = "chrono-tz-slice", t03_row = "`chrono-tz` slice", instances = "web/assets/tz/*.bin", files = ["."], budget_bytes = 40_000, eager = false }, # "." = the instance file
]
