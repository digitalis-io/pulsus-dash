# ci:dep-audit configuration (T01-002, T03-008). See docs/development/build-and-ci.md.
browser_roots = ["dash-core-mt"]
npm_dev_allow = ["@playwright/test", "playwright", "playwright-core", "@axe-core/playwright", "axe-core"]
render_worker_crates = ["dash-scene", "dash-gpu", "dash-marks", "dash-state"] # T03-008
web_dir = "web"
allowed_url_prefixes = [
  "http://www.w3.org/", # XML/SVG namespace URIs; never fetched
  # A documentation link in a comment of the wasm-bindgen glue (web/shim/gen/); never fetched.
  "https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Operators/typeof#description",
]

[web_sys] # per-crate web-sys feature allowlist (T03 §5.6)
dash-gpu = ["OffscreenCanvas"]
dash-core-mt = ["OffscreenCanvas", "Performance"] # timeOrigin

# [[lock_allow]]     # audited exceptions to T03-008; none
# [[browser_crate]]: non-member crates allowed in the browser graph (name, reason), each reviewed
# against ADR-0001/0004/0007 and T01-002. Reason: "<dependent>: <what it is>; not a UI, component,
# charting, mapping or diagram library (T01-002)".

