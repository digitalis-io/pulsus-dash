# server/.golangci.yml (golangci-lint 2.15.0)
version: "2"
run: { build-tags: [itest] }
linters:
  default: none
  enable: [depguard, errcheck, forbidigo, gosec, govet, ineffassign, staticcheck, unused]
  settings:
    depguard: { rules: {
      store-only: { files: ["$all", "!**/internal/store/**"], deny: [
        { pkg: github.com/jackc/pgx, desc: "pgx is used only in internal/store (T11-023, ADR-0015)" },
        { pkg: github.com/pressly/goose, desc: "migrations run only in internal/store (T11-015)" },
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/store/dbgen, desc: "sqlc output is used only in internal/store (T11-023)" } ] },
      gateway-only: { files: ["$all", "!**/internal/gateway/**"], deny: [
        { pkg: github.com/go-chi/chi, desc: "the router is used only in internal/gateway (T06-001)" },
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/gateway/api, desc: "the generated server is used only in internal/gateway (T06-001)" } ] },
      promql-parser: { files: ["$all", "!**/internal/pulsusdb/prom/**"], deny: [
        { pkg: github.com/prometheus/prometheus, desc: "the upstream PromQL parser is used only in internal/pulsusdb/prom (ADR-0021)" } ] },
      # T06-028, ADR-0018 §3, §4: the language modules import no other language module, and only
      # their callers (internal/gateway today) import a language module.
      logs-isolation: { files: ["**/internal/pulsusdb/logs/**"], deny: [
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/pulsusdb/prom, desc: "a language module imports no other language module (T06-028, ADR-0018 §3)" } ] },
      prom-isolation: { files: ["**/internal/pulsusdb/prom/**"], deny: [
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/pulsusdb/logs, desc: "a language module imports no other language module (T06-028, ADR-0018 §3)" } ] },
      modules-from-callers: { files: ["$all", "!**/internal/pulsusdb/prom/**", "!**/internal/pulsusdb/logs/**", "!**/internal/gateway/**"], deny: [
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/pulsusdb/prom, desc: "only the language modules' callers import a language module: internal/gateway today (T06-028, ADR-0018 §3, §4)" },
        { pkg: github.com/digitalis-io/pulsus-dash/server/internal/pulsusdb/logs, desc: "only the language modules' callers import a language module: internal/gateway today (T06-028, ADR-0018 §3, §4)" } ] } } }
    # T06-005 and plan #62 §4.9: outbound HTTP only in internal/pulsusdb (and the allowed callers
    # below); every upstream body decoder yields strings only through redact (updec.go today).
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: '^http\.(Client|Transport|DefaultClient|DefaultTransport|Get|Head|Post|PostForm|NewRequest|NewRequestWithContext)$'
          pkg: '^net/http$'
          msg: 'pulsusdb-only: outbound HTTP is made only in internal/pulsusdb and the allowed packages (T06-005)'
        - pattern: '^json\.(Unmarshal|NewDecoder|RawMessage)$|^\(\*json\.Decoder\)\.Decode$'
          pkg: '^encoding/json$'
          msg: 'pulsusdb-decoder: every upstream body decoder yields strings only through redact; encoding/json does not (§4.9)'
  exclusions:
    rules:
      - { path: 'internal/pulsusdb/', text: 'pulsusdb-only', linters: [forbidigo] }
      - { path-except: 'internal/pulsusdb/', text: 'pulsusdb-decoder', linters: [forbidigo] }
      - { path: 'internal/pulsusdb/.*_test\.go$', text: 'pulsusdb-decoder', linters: [forbidigo] }   # tests decode responses to compare
      - { path: '_test\.go$', linters: [forbidigo] }
      - { path: 'internal/gateway/selfcheck\.go$', linters: [forbidigo] }   # T19-002 self-check
      - { path: 'cmd/pulsus-dash/serve\.go$', linters: [forbidigo] }       # its client (2 s, no redirects)
