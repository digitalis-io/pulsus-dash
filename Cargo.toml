[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
dash-axes = { path = "crates/dash-axes" }
dash-gpu = { path = "crates/dash-gpu" }
dash-lab = { path = "crates/dash-lab" }
dash-marks = { path = "crates/dash-marks" }
dash-protocol = { path = "crates/dash-protocol" }
dash-scales = { path = "crates/dash-scales" }
dash-scene = { path = "crates/dash-scene" }
dash-tokens = { path = "crates/dash-tokens" }
dash-wire = { path = "crates/dash-wire" }
pulsus-synth = { path = "crates/pulsus-synth" }
arrow-array = { version = "60.1.0", default-features = false }
arrow-buffer = { version = "60.1.0", default-features = false }
arrow-ipc = { version = "60.1.0", default-features = false }
arrow-schema = { version = "60.1.0", default-features = false }
pollster = "1.0.3"
wgpu = { version = "30.0.2", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
arc-swap = "1.9.5"
bytemuck = { version = "1.25.2", features = ["derive"] }
naga = "30.0.2"
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.wasm-release] # T03 §5.6 build profile; `cargo xtask gen` runs wasm-opt -O3 after it
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
