[workspace]
resolver = "3"
members = ["crates/*", "server/bin/*", "server/crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
dash-axes = { path = "crates/dash-axes" }
dash-gpu = { path = "crates/dash-gpu" }
dash-lab = { path = "crates/dash-lab" }
dash-marks = { path = "crates/dash-marks" }
dash-protocol = { path = "crates/dash-protocol" }
dash-scales = { path = "crates/dash-scales" }
dash-scene = { path = "crates/dash-scene" }
dash-tokens = { path = "crates/dash-tokens" }
dash-wire = { path = "crates/dash-wire" }
wgpu = { version = "30.0.2", default-features = false, features = ["std", "webgpu", "webgl", "wgsl"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = "0.3.107"
arc-swap = "1.9.5"
bytemuck = { version = "1.25.2", features = ["derive"] }
naga = "30.0.2"
serde_json = "1"
# Server (T06 §4.1)
dash-core = { path = "server/crates/dash-core" }
dash-config = { path = "server/crates/dash-config" }
dash-store = { path = "server/crates/dash-store" }
dash-gateway = { path = "server/crates/dash-gateway" }
uuid = { version = "1.29", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = { version = "2.5", features = ["serde"] }
tokio = "1.54"
tokio-util = "0.7"
async-trait = "0.1"
serde_norway = "0.9"
serde_path_to_error = "0.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "json", "time"] }
time = "0.3"
tracing = "0.1"
axum = "0.8.9"
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
http-body-util = "0.1.5"
tempfile = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.wasm-release] # T03 §5.6 build profile; `cargo xtask gen` runs wasm-opt -O3 after it
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
