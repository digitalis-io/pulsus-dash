[package]
name = "dash-core"
description = "The engine in the browser: the render worker's frame table, events and (wasm32) the wasm-bindgen exports, GPU surfaces and the rayon pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# A test hook build of the renderer (`fail_maps_after`); never in the release engine.
test-hooks = ["dash-gpu/test-hooks"]

[dependencies]
dash-gpu.workspace = true
dash-marks.workspace = true
dash-protocol.workspace = true
dash-scales.workspace = true
dash-scene.workspace = true
dash-tokens.workspace = true
dash-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dash-marks = { workspace = true, features = ["gpu"] }
js-sys.workspace = true
rayon.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# T03 §5.6: an allow-list.
web-sys = { workspace = true, features = [
  "console",
  "ImageBitmap",
  "ImageBitmapRenderingContext",
  "OffscreenCanvas",
  "Performance",
  "WorkerGlobalScope",
] }
wgpu.workspace = true


[dev-dependencies]
pulsus-synth.workspace = true
