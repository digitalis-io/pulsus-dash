[package]
name = "dash-core"
description = "The engine in the browser: the render worker's frame table, events and (wasm32) the wasm-bindgen exports, GPU surfaces and the rayon pool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Plan #68 C2d2 §3.1: `mt` (default) is the shared-memory engine with the rayon pool and the
# parallel CPU decimation (the one switch for `dash-scales/parallel`); `st` (`dash-core-st`,
# `--no-default-features --features st`) has neither: its own memory and sequential decimation.
default = ["mt"]
mt = ["dash-scales/parallel", "dep:rayon"]
st = []
# A test hook build of the renderer (`fail_maps_after`); never in the release engine.
test-hooks = ["dash-gpu/test-hooks"]
# The probe build of `e2e:shim-fuzz` (plan #68 C2a1 §3.5): `engine_probe_input` and
# `engine_probe_ring_start`; never in the release or fault builds (T03-024, `ci:probe-absent`).
# Plan #68 C2d1 §3.2: `engine_probe_synth` builds F1c (`pulsus-synth`) in the worker.
probe = ["dep:pulsus-synth"]

[dependencies]
dash-gpu.workspace = true
dash-marks.workspace = true
dash-protocol.workspace = true
dash-scales.workspace = true
dash-scene.workspace = true
dash-tokens.workspace = true
dash-wire.workspace = true
pulsus-synth = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dash-marks = { workspace = true, features = ["gpu"] }
js-sys.workspace = true
rayon = { workspace = true, optional = true }
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
# T03 §5.6: an allow-list.
web-sys = { workspace = true, features = [
  "console",
  "ImageBitmap",
  "ImageBitmapRenderingContext",
  "OffscreenCanvas",
  "Performance",
  "WorkerGlobalScope",
] }
wgpu.workspace = true


[dev-dependencies]
dash-axes.workspace = true
pulsus-synth.workspace = true
