[package]
name = "dash-scales"
description = "Value ticks, value encoding, column ranges and the CPU decimation reference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Plan #68 C2d2: decimation P1 and P5 on rayon (T03-021). Without it the same loops run
# sequentially with the same output (`dash-core-st`). No default features.
parallel = ["dep:rayon"]

[dependencies]
bytemuck.workspace = true
dash-units.workspace = true
dash-wire.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true
