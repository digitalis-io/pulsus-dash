# Engine tool and golden-environment pins (plan #68 A.2). Read by the golden tests and by CI; the
# literals in ci/lavapipe.Dockerfile must equal these (`cargo xtask spec-lint`). A Mesa, LLVM,
# snapshot or image change is one PR that edits this file and the Dockerfile together and carries
# the `golden-update` label (T05-004).
[golden]
image = "docker.io/library/ubuntu:noble-20261110@sha256:73b999393d07f2bf65a40373778a44dc9a6d54ad7718d29247d8ff9413c4d6a8"
apt_snapshot = "20261115T000000Z"
mesa = "25.2.8-0ubuntu0.24.04.4"
mesa_upstream = "25.2.8"          # golden tests assert AdapterInfo.driver_info contains "Mesa 25.2.8"
llvm = "1:20.1.2-0ubuntu1~24.04.3"
vulkan_loader = "1.3.275.0-1build1"
ca_certificates = "20240203"        # noble release pocket (bootstraps HTTPS to the snapshot)

[tools]
rust = "1.98.0"
rustup = "1.29.3"
rustup_sha256 = "b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55"
cargo_nextest = "0.9.152"
cargo_deny = "0.20.2"

# The engine web image (plan #68 C1 §5.1, engine/ci/web.Dockerfile, built on the image above): the
# nightly for the threaded wasm build (T03 §5.6), wasm-bindgen (equal to Cargo.lock), binaryen,
# Node, Go and Playwright's Chromium. The Dockerfile literals must equal these (`cargo xtask
# spec-lint`).
[web]
nightly = "nightly-2026-11-15"
wasm_bindgen = "0.2.130"
binaryen = "version_133"
binaryen_sha256 = "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489"
node = "24.22.3"
node_sha256 = "4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb"
go = "1.27.4"
go_sha256 = "7226736c2339719cda28fbf3a54d71aa63bcefe376e98cef00034268dab24840"
playwright = "1.65.0"
