[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
wgpu = { version = "=30.0.2", default-features = false, features = ["std", "wgsl", "webgpu", "webgl", "vulkan"] }
naga = { version = "=30.0.2", features = ["wgsl-in"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.34.3", default-features = false, features = ["std", "f64"] }
rayon = "=1.12.0"
pollster = "=1.0.1"
png = "=0.18.1"
nv-flip = "=0.1.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
proptest = "=1.12.0"
# The browser engine (plan #68 C1 §2): equal to the wasm-bindgen CLI in tools.toml [web].
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "=0.4.80"
js-sys = "=0.3.107"
web-sys = "=0.3.107"
dash-tokens = { path = "crates/dash-tokens" }
dash-units = { path = "crates/dash-units" }
dash-colour = { path = "crates/dash-colour" }
# Plan #68 C2d2: no default features, so no dependent turns `parallel` on implicitly.
dash-scales = { path = "crates/dash-scales", default-features = false }
dash-axes = { path = "crates/dash-axes" }
dash-wire = { path = "crates/dash-wire" }
dash-scene = { path = "crates/dash-scene" }
dash-gpu = { path = "crates/dash-gpu" }
dash-marks = { path = "crates/dash-marks" }
pulsus-synth = { path = "crates/pulsus-synth" }
dash-protocol = { path = "crates/dash-protocol" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
disallowed_types = "deny"

# dash-wire's split-point and fuzz-smoke tests decode about 10⁵ bodies each; optimising the
# crate in the dev/test profile keeps unit:dsf-fuzz-smoke under its 30 s (plan #68 B2 §5).
# Overflow checks and debug assertions stay on.
[profile.dev.package.dash-wire]
opt-level = 2

# T03 §5.6; used by Part C.
[profile.wasm-release]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
