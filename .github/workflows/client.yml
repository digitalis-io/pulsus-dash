# Web client gates (ADR-0014 §6, T05 §7.1). Actions are pinned by commit SHA; no secrets are used.
name: client

on:
  pull_request:
    # `labeled`: adding `golden-update` reruns the e2e jobs with baseline writing on (T05-005).
    types: [opened, synchronize, reopened, labeled]
    # The e2e suite runs against BFF binaries built from server/ (plan #59 Part B).
    paths:
      - 'client/**'
      - 'design/tokens.toml'
      # The engine parity fixtures and the generated Rust tokens are checked by npm test (#68).
      - 'engine/fixtures/**'
      - 'engine/crates/dash-tokens/src/tokens.rs'
      - 'server/**'
      - 'api/**'
      - 'tools/e2e/**'
      - 'wire/**'
      - 'dev/pulsus-fake.*'
      - 'Makefile'
      - '.github/workflows/client.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_API_MODE: stub

defaults:
  run:
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 'ci:lockfile (install)'
        run: npm ci
      - name: 'ci:lockfile'
        run: npm run check:lockfile
      - name: 'ci:lint-ts'
        run: npm run lint
      - name: 'ci:typecheck'
        run: npm run typecheck
      - name: 'ci:token-lint (regenerate)'
        run: npm run tokens -- --check
      - name: 'ci:token-lint'
        run: npm run token-lint
      - name: unit
        run: npm test
      - name: build
        run: npm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
      - name: 'ci:bundle-size'
        run: npm run size
      - name: 'http build has no gallery'
        run: |
          VITE_API_MODE=http npx --no-install vite build --outDir dist-http --emptyOutDir
          ! grep -q '"src/dev/' dist-http/.vite/manifest.json
      - name: 'ci:dep-audit (build origins)'
        run: npm run origins
      - name: 'ci:dep-audit, ci:npm-audit'
        run: npm run audit

  # Each browser runs as four jobs (#130, client/config/e2eShards.ts): `kbd-a` and `kbd-b` take
  # keyboard parts of e2e:a11y-rooms by tag, `rest-b` the spec files of REST_B_FILES, `rest` every
  # other test. e2e-report merges them.
  e2e:
    needs: check
    runs-on: ubuntu-24.04
    # The longest shard's test step is ~20 min (kbd-b); Playwright's globalTimeout (25 min) ends an
    # overrun first, with its artefacts.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [kbd-a, kbd-b, rest, rest-b]
    env:
      # For make e2e-build's Go build, as server.yml sets them.
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    services:
      pg16:
        image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly the toolchain line of server/go.mod: go-version-file reads only the go line
          # (1.27.0), and GOTOOLCHAIN=local would then keep that older release.
          go-version: '1.27.4'
          cache-dependency-path: server/go.sum
      - name: Go matches the server/go.mod toolchain
        working-directory: .
        run: |
          want=$(sed -n 's/^toolchain //p' server/go.mod)
          got=$(go env GOVERSION)
          [ "$got" = "$want" ] || { echo "::error::Go is $got, server/go.mod pins $want"; exit 1; }
      # The browser and its system packages are cached per Playwright version and ISO week.
      - name: Playwright version, cache week, browser path
        id: pw
        run: |
          echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/pw-browsers" >> "$GITHUB_ENV"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/pw-browsers
            ${{ runner.temp }}/pw-apt
          key: pw-${{ matrix.browser }}-${{ steps.pw.outputs.version }}-ubuntu-24.04-${{ steps.pw.outputs.week }}
          restore-keys: pw-${{ matrix.browser }}-${{ steps.pw.outputs.version }}-ubuntu-24.04-
      - name: browser system packages (cached debs)
        run: |
          debs="$RUNNER_TEMP/pw-apt"; mkdir -p "$debs"
          if compgen -G "$debs/*.deb" > /dev/null; then sudo cp "$debs"/*.deb /var/cache/apt/archives/; fi
          npx --no-install playwright install-deps ${{ matrix.browser }}
          sudo apt-get autoclean -y
          rm -f "$debs"/*.deb
          cp /var/cache/apt/archives/*.deb "$debs"/ 2>/dev/null || true
      - run: npx --no-install playwright install ${{ matrix.browser }}
      - name: e2e database
        working-directory: .
        run: |
          docker exec -i ${{ job.services.pg16.id }} psql -U postgres -v ON_ERROR_STOP=1 < server/deploy/postgres-roles.sql
          docker exec ${{ job.services.pg16.id }} psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE pulsus_e2e OWNER pulsus_owner"
      - name: e2e build (stub-mode and http-mode BFF binaries)
        working-directory: .
        run: make e2e-build
      - run: npm run e2e -- --project=${{ matrix.browser }} ${{ matrix.shard == 'rest' && '--grep @nothing' || '' }}
        env:
          E2E_SHARD: ${{ matrix.shard }}
          E2E_PG_APP_URL: postgres://pulsus_app@localhost:55432/pulsus_e2e?sslmode=disable
          E2E_PG_OWNER_URL: postgres://pulsus_owner@localhost:55432/pulsus_e2e?sslmode=disable
          # Baselines are written only on Chromium's `rest` shard (the goldens' shard), and only
          # under the `golden-update` label.
          PW_UPDATE_GOLDENS: >-
            ${{ matrix.browser == 'chromium' && matrix.shard == 'rest' && contains(github.event.pull_request.labels.*.name, 'golden-update') && '1' || '0' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            client/blob-report/
            client/test-results/
          retention-days: 14
      - if: ${{ !cancelled() && matrix.browser == 'chromium' && matrix.shard == 'rest' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: client/e2e/__screenshots__/
          retention-days: 14

  # Per browser, after its four shards (also when one failed): the merged HTML report,
  # ci:e2e-complete (every listed test is in exactly one shard, retries allowed, and was not
  # skipped, T05 §7.1) and e2e:a11y-rooms
  # over the keyboard parts of all four shards.
  e2e-report:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      B: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-${{ matrix.browser }}-*
          path: client/shards
      - name: merged report and per-shard JSON
        run: |
          mkdir -p all-blob ran && cp shards/*/blob-report/*.zip all-blob/
          npx --no-install playwright merge-reports --reporter=html all-blob
          for d in shards/e2e-"$B"-*/; do s=$(basename "$d"); s=${s#e2e-"$B"-}
            PLAYWRIGHT_JSON_OUTPUT_NAME="ran/$s.json" npx --no-install playwright merge-reports --reporter=json "$d/blob-report"
          done
      - name: 'ci:e2e-complete'
        if: ${{ !cancelled() }}
        run: |
          PLAYWRIGHT_JSON_OUTPUT_NAME=listed.json npx --no-install playwright test --list --reporter=json --project="$B"
          npm run e2e:complete -- listed.json "$B" ran/*.json
      - name: 'e2e:a11y-rooms (merged keyboard coverage)'
        if: ${{ !cancelled() }}
        run: npm run e2e:keyboard-coverage -- shards "$B"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.browser }}
          path: client/playwright-report/
          retention-days: 14
