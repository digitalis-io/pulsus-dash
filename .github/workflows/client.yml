# Web client gates (ADR-0014 §6, T05 §7.1). Actions are pinned by commit SHA; no secrets are used.
name: client

on:
  pull_request:
    # `labeled`: adding `golden-update` reruns the e2e jobs with baseline writing on (T05-005).
    types: [opened, synchronize, reopened, labeled]
    paths: ['client/**', 'design/tokens.toml', '.github/workflows/client.yml']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_API_MODE: stub

defaults:
  run:
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 'ci:lockfile (install)'
        run: npm ci
      - name: 'ci:lockfile'
        run: npm run check:lockfile
      - name: 'ci:lint-ts'
        run: npm run lint
      - name: 'ci:typecheck'
        run: npm run typecheck
      - name: 'ci:token-lint (regenerate)'
        run: npm run tokens -- --check
      - name: 'ci:token-lint'
        run: npm run token-lint
      - name: unit
        run: npm test
      - name: build
        run: npm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
      - name: 'ci:bundle-size'
        run: npm run size
      - name: 'http build has no gallery'
        run: |
          VITE_API_MODE=http npx --no-install vite build --outDir dist-http --emptyOutDir
          ! grep -q '"src/dev/' dist-http/.vite/manifest.json
      - name: 'ci:dep-audit (build origins)'
        run: npm run origins
      - name: 'ci:dep-audit, ci:npm-audit'
        run: npm run audit

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - run: npm run e2e -- --project=${{ matrix.browser }}
        env:
          # Baselines are written only on Chromium, and only under the `golden-update` label.
          PW_UPDATE_GOLDENS: >-
            ${{ matrix.browser == 'chromium' && contains(github.event.pull_request.labels.*.name, 'golden-update') && '1' || '0' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 14
      - if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: client/e2e/__screenshots__/
          retention-days: 14
