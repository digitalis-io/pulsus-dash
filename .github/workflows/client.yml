# Web client gates (ADR-0014 §6, T05 §7.1). Actions are pinned by commit SHA; no secrets are used.
name: client

on:
  pull_request:
    # `labeled`: adding `golden-update` reruns the e2e jobs with baseline writing on (T05-005).
    types: [opened, synchronize, reopened, labeled]
    # The e2e suite runs against BFF binaries built from server/ (plan #59 Part B).
    paths:
      - 'client/**'
      - 'design/tokens.toml'
      - 'server/**'
      - 'api/**'
      - 'tools/e2e/**'
      - 'wire/**'
      - 'dev/pulsus-fake.*'
      - 'Makefile'
      - '.github/workflows/client.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  VITE_API_MODE: stub

defaults:
  run:
    working-directory: client

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: 'ci:lockfile (install)'
        run: npm ci
      - name: 'ci:lockfile'
        run: npm run check:lockfile
      - name: 'ci:lint-ts'
        run: npm run lint
      - name: 'ci:typecheck'
        run: npm run typecheck
      - name: 'ci:token-lint (regenerate)'
        run: npm run tokens -- --check
      - name: 'ci:token-lint'
        run: npm run token-lint
      - name: unit
        run: npm test
      - name: build
        run: npm run build
        env:
          VITE_GIT_SHA: ${{ github.sha }}
      - name: 'ci:bundle-size'
        run: npm run size
      - name: 'http build has no gallery'
        run: |
          VITE_API_MODE=http npx --no-install vite build --outDir dist-http --emptyOutDir
          ! grep -q '"src/dev/' dist-http/.vite/manifest.json
      - name: 'ci:dep-audit (build origins)'
        run: npm run origins
      - name: 'ci:dep-audit, ci:npm-audit'
        run: npm run audit

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      # For make e2e-build's Go build, as server.yml sets them.
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    services:
      pg16:
        image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Exactly the toolchain line of server/go.mod: go-version-file reads only the go line
          # (1.27.0), and GOTOOLCHAIN=local would then keep that older release.
          go-version: '1.27.4'
          cache-dependency-path: server/go.sum
      - name: Go matches the server/go.mod toolchain
        working-directory: .
        run: |
          want=$(sed -n 's/^toolchain //p' server/go.mod)
          got=$(go env GOVERSION)
          [ "$got" = "$want" ] || { echo "::error::Go is $got, server/go.mod pins $want"; exit 1; }
      - run: npx --no-install playwright install --with-deps ${{ matrix.browser }}
      - name: e2e database
        working-directory: .
        run: |
          docker exec -i ${{ job.services.pg16.id }} psql -U postgres -v ON_ERROR_STOP=1 < server/deploy/postgres-roles.sql
          docker exec ${{ job.services.pg16.id }} psql -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE pulsus_e2e OWNER pulsus_owner"
      - name: e2e build (stub-mode and http-mode BFF binaries)
        working-directory: .
        run: make e2e-build
      - run: npm run e2e -- --project=${{ matrix.browser }}
        env:
          E2E_PG_APP_URL: postgres://pulsus_app@localhost:55432/pulsus_e2e?sslmode=disable
          E2E_PG_OWNER_URL: postgres://pulsus_owner@localhost:55432/pulsus_e2e?sslmode=disable
          # Baselines are written only on Chromium, and only under the `golden-update` label.
          PW_UPDATE_GOLDENS: >-
            ${{ matrix.browser == 'chromium' && contains(github.event.pull_request.labels.*.name, 'golden-update') && '1' || '0' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 14
      - if: ${{ !cancelled() && matrix.browser == 'chromium' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: client/e2e/__screenshots__/
          retention-days: 14
