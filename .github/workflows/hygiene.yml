# Repository hygiene (T05 §7.1 ci:no-pulsusdb-host). Runs on every pull request; reads one secret.
# DASH_FORBIDDEN_HOSTS is a repository secret created by an owner (docs/development/build-and-ci.md);
# without it the check fails with exit 2. Pull requests from forks cannot read it.
name: hygiene
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'hygiene-${{ github.ref }}', cancel-in-progress: true }
jobs:
  no-pulsusdb-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'ci:no-pulsusdb-host (self-test)'
        run: python3 -I -m unittest discover -s tools/no-pulsusdb-host -p 'test_*.py'
      - name: 'ci:no-pulsusdb-host'
        env: { DASH_FORBIDDEN_HOSTS: '${{ secrets.DASH_FORBIDDEN_HOSTS }}' }
        run: python3 -I tools/no-pulsusdb-host/check.py --require-secret
