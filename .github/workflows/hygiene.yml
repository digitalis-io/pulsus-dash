# Repository hygiene (T05 §7.1 ci:no-pulsusdb-host). Runs on every pull request; reads no secret.
# The check needs no host name: it rejects any non-local PulsusDB URL or datasource value
# (docs/development/build-and-ci.md#ci-no-pulsusdb-host).
name: hygiene
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
concurrency: { group: 'hygiene-${{ github.ref }}', cancel-in-progress: true }
jobs:
  no-pulsusdb-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: 'ci:no-pulsusdb-host (self-test)'
        run: python3 -I -m unittest discover -s tools/no-pulsusdb-host -p 'test_*.py'
      - name: 'ci:no-pulsusdb-host'
        run: python3 -I tools/no-pulsusdb-host/check.py
