# Pulsus Dash design tokens: the single source of colour, spacing, size, type and motion values.
# `client/scripts/gen-tokens.ts` generates `client/src/styles/tokens.css`, `tokens.ts` and the
# engine's `engine/crates/dash-tokens/src/tokens.rs` from this file (VL-001, VL-021, T08-022,
# T01-010). `series-1`…`series-8` (categorical, VL-002) and `ramp-1`…`ramp-9`
# (sequential, single hue, VL-006) must be numbered contiguously from 1; they are also emitted as
# ordered arrays (`seriesPalette`, `sequentialRamp`). Colours are uppercase #RRGGBB or #RRGGBBAA;
# lengths are px; durations are ms. Light colours are designed, not inverted from dark (VL-001).

[color.dark]
canvas = "#0E1014"
surface-1 = "#15171C"
surface-2 = "#1D2026"
surface-hover = "#262A31"
hairline = "#FFFFFF14"
text = "#E9EBEF"
text-muted = "#9AA1AC"
text-on-accent = "#F5F8FF"
accent = "#4D9BFF"
focus = "#4D9BFF"
ok = "#2FB59A"
watch = "#D9C84A"
degraded = "#E8923A"
failing = "#E0457B"
unknown = "#6B7280"
backdrop = "#05060899"
# The visual refresh (#282, VL-001 as amended): the source list, controls, fields and their edges,
# the 1 px top highlight and the two shadow layers of the elevation tokens, the accent as a fill
# (buttons, the current row, the segmented thumb, the focused menu row) and the two materials.
sidebar = "#121418"
control = "#23272E"
control-hover = "#2A2F37"
control-pressed = "#31363F"
field = "#111317"
border-control = "#FFFFFF29"
# Field boundaries (fields, select triggers, unchecked boxes): at least 3:1 from the fill and every
# surface beneath (VL-009).
border-field = "#6A717C"
highlight = "#FFFFFF0F"
shadow-ambient = "#00000066"
shadow-key = "#0000008C"
accent-fill = "#2B68D6"
accent-pressed = "#255CC0"
material-bar = "#15171CE6"
material-menu = "#1E2127EB"
series-1 = "#7AA2D6"
series-2 = "#C9A36B"
series-3 = "#8FBF8F"
series-4 = "#B48FC9"
series-5 = "#6FB8B8"
series-6 = "#C98F8F"
series-7 = "#A8A8D9"
series-8 = "#BFB07A"
ramp-1 = "#253444"
ramp-2 = "#2C4967"
ramp-3 = "#345E89"
ramp-4 = "#4075A9"
ramp-5 = "#538CC5"
ramp-6 = "#6DA3DB"
ramp-7 = "#8DBBEB"
ramp-8 = "#B1D3F7"
ramp-9 = "#D8EAFE"
brush = "#5B9BFF29"
# The geomap's floating overlay (T24-091): surface-1 at 94 %.
surface-float = "#15171CF0"
# The shared selection's band and log-row background (T25-006): accent at 16 %.
selection = "#5B9BFF29"
# Query syntax (#63 Part B): each at least 4.5:1 on surface-1 and surface-2.
syn-keyword = "#B48FC9"
syn-func = "#7AA2D6"
syn-string = "#8FBF8F"
syn-number = "#D6A86B"
syn-label = "#6FB8B8"
# Log levels (#66 Part B): the hues of VL-002 Table 8-1a; never state colours (VL-003).
level-critical = "#C98F8F"
level-error = "#C98F8F"
level-warn = "#C9A36B"
level-info = "#7AA2D6"
level-debug = "#6FB8B8"
level-trace = "#B48FC9"
level-unknown = "#8FBF8F"
# The geomap (T24-091, #234): calm water and land, a 1 px coast and 0.5 px shared borders; every
# series colour keeps at least 3:1 on map-land and map-water.
map-water = "#0E1620"
map-land = "#1C232C"
map-coast = "#FFFFFF33"
map-border = "#FFFFFF1F"
# Geomap marks (T24-090, #234): pattern strokes over a fill, and the aggregate's fill (T21-003,
# T22-004).
pattern-ink = "#0B0D10A6"
category-other = "#8A919C"
# A failing board panel's glow (#282 Part 2a, VL-004 as amended): failing at 15 %. A state token:
# only theme/stateEncoding.module.css uses it.
failing-glow = "#E0457B26"

[color.light]
canvas = "#F2F3F6"
surface-1 = "#FFFFFF"
surface-2 = "#EEF0F3"
surface-hover = "#E5E8ED"
hairline = "#1C223314"
text = "#1B1E25"
text-muted = "#565E6B"
text-on-accent = "#FFFFFF"
accent = "#185FCC"
focus = "#185FCC"
ok = "#17806A"
watch = "#8A7A0F"
degraded = "#A85A12"
failing = "#B8285C"
unknown = "#7A818C"
backdrop = "#1B1E2540"
# The visual refresh (#282, VL-001 as amended): see color.dark.
sidebar = "#EBEDF1"
control = "#FFFFFF"
control-hover = "#F6F7F9"
control-pressed = "#ECEEF1"
field = "#FCFCFD"
border-control = "#1C22333D"
# Field boundaries: at least 3:1 from the fill and every surface beneath (VL-009).
border-field = "#7D8490"
highlight = "#FFFFFF99"
shadow-ambient = "#141A2414"
shadow-key = "#141A2426"
accent-fill = "#185FCC"
accent-pressed = "#1552B3"
material-bar = "#FFFFFFD9"
material-menu = "#FAFBFCE6"
series-1 = "#3F6FA8"
series-2 = "#93703A"
series-3 = "#4E874E"
series-4 = "#7E5A97"
series-5 = "#358282"
series-6 = "#985757"
series-7 = "#6262A6"
series-8 = "#857640"
ramp-1 = "#E3F0FE"
ramp-2 = "#B9DAFD"
ramp-3 = "#94C3F5"
ramp-4 = "#73ACE6"
ramp-5 = "#5995D1"
ramp-6 = "#477EB6"
ramp-7 = "#3C6995"
ramp-8 = "#365371"
ramp-9 = "#313F4D"
brush = "#2563C929"
# The geomap's floating overlay (T24-091): surface-1 at 94 %.
surface-float = "#FFFFFFF0"
# The shared selection's band and log-row background (T25-006): accent at 16 %.
selection = "#2563C929"
# Query syntax (#63 Part B): each at least 4.5:1 on surface-1 and surface-2.
syn-keyword = "#6B4A84"
syn-func = "#2563C9"
syn-string = "#3D7340"
syn-number = "#7F5F2A"
syn-label = "#2E6E6E"
# Log levels (#66 Part B): the hues of VL-002 Table 8-1a; never state colours (VL-003).
level-critical = "#985757"
level-error = "#985757"
level-warn = "#93703A"
level-info = "#3F6FA8"
level-debug = "#358282"
level-trace = "#7E5A97"
level-unknown = "#4E874E"
# The geomap (T24-091, #234): calm water and land, a 1 px coast and 0.5 px shared borders; every
# series colour keeps at least 3:1 on map-land and map-water.
map-water = "#E6EDF4"
map-land = "#F8F9FB"
map-coast = "#0B0D103D"
map-border = "#0B0D1029"
# Geomap marks (T24-090, #234): pattern strokes over a fill, and the aggregate's fill (T21-003,
# T22-004).
pattern-ink = "#FFFFFFB3"
category-other = "#6B7280"
# A failing board panel's glow (#282 Part 2a): failing at 10 %.
failing-glow = "#B8285C1A"

# Spacing scale (px).
[space]
# Insets inside a control (the segmented track, #282).
0-5 = 2
1 = 4
2 = 8
3 = 12
4 = 16
5 = 20
6 = 24
8 = 32
10 = 40
12 = 48
16 = 64

# Component and layout sizes (px). Sidebar widths are VL-017's. `chart*` sizes are the chart
# frame heights, axis tick length, line width and minimum brush drag (#58).
[size]
sidebar-expanded = 212
sidebar-collapsed = 56
crumb-max = 160
tenant-badge = 32
focus-ring = 3
focus-offset = 1
header = 56
control = 28
target-min = 24
icon = 16
avatar = 28
page-padding = 20
# The content's top padding and the board's panel gap (#282 Part 2a, VL-017 as amended).
page-padding-top = 12
board-gap = 12
chart = 240
chart-stat = 120
chart-tick = 4
chart-line = 1.5
chart-brush-min = 4
# Threshold lines and stat tiles (#64 Part B, ADR-0022): the stat sparkline height and the dash pattern.
chart-sparkline = 32
chart-dash = 5
chart-dash-gap = 4
# Boards (plan #61 Part B): 12 columns of 40 px rows; the panel header (the drag handle in Edit).
board-cols = 12
board-row = 40
board-panel-header = 36
# A board panel's legend is a table from this stack height, compact below (#64 Part B §4.5).
board-legend-table-min = 240
# The fixed-size editing window (kit ModalDialog size "editor", #90).
dialog-editor-width = 800
dialog-editor-height = 720
# The log stream (#66 Part B): a row (one line without wrap), a sentinel row and the level bar;
# the level tag, 4 px inside a 24 px row (#282 Part 2a).
log-row = 24
log-sentinel = 40
log-level-bar = 3
log-tag = 16
# The Log lines card of Explore › Logs (#66 Part C): the list's height.
log-stream = 560
# The Inspector (T25 §4.4): the sheet's width, its collapsed tab and its inset from the content.
inspector = 360
inspector-tab = 40
inspector-inset = 12
# The table view (#173 Part 3a, T22-013): one row of a panel's virtualised table.
table-row = 28
# The list widgets (#216 Part 2a, T24-027): a row and a tag chip.
list-row = 36
list-chip = 20

# The radius scale (VL-019 as amended, #282 Part 2a; no capsules): controls, fields and tooltips;
# menu items, segments, chips and the checkbox; cards, panels, popovers, menus and the Inspector;
# dialogs; tags (state, log level and list tags).
[radius]
default = 6
xs = 4
md = 8
lg = 10
tag = 3

# Alphas (0..1): unselected marks while a selection is relevant (T25-006); the tint of tags and
# chips and the stat sparkline's area at its top (#282 Part 2a).
[opacity]
dimmed = 0.35
tag = 0.18
chip = 0.12
area = 0.28

[border]
hairline = 1

[font.family]
ui = '"Inter Variable", system-ui, sans-serif'
mono = '"JetBrains Mono Variable", ui-monospace, monospace'
# The platform UI face on Apple systems (VL-010 as amended, ADR-0035; `html[data-platform='apple']`).
ui-apple = '-apple-system, BlinkMacSystemFont, "Inter Variable", system-ui, sans-serif'

# Font sizes (px).
[font.size]
xs = 11
sm = 12
md = 13
lg = 16
xl = 20
# The page title (#282 Part 2a).
title = 22
display = 32

[font.weight]
regular = 400
medium = 500
semibold = 600
bold = 700

# Glyph advance (em): JetBrains Mono's 600/1000; the engine measures axis labels with it (#68).
[font.advance]
mono = 0.6

# Letter spacing (em) for Inter at the larger sizes; the Apple system face tracks itself (0).
# Each within ±0.05.
[font.tracking]
lg = -0.011
xl = -0.017
display = -0.022

[line-height]
tight = 1.25
normal = 1.5

# Elevation (VL-004 as amended, #282): the only drop shadows the DOM chrome may use, hue-free, in
# stacking order; a 1 px top highlight and an ambient and a key shadow.
[elevation]
1 = "inset 0 1px 0 var(--highlight), 0 1px 2px var(--shadow-ambient)"
2 = "inset 0 1px 0 var(--highlight), 0 2px 6px var(--shadow-ambient), 0 12px 32px var(--shadow-key)"
3 = "inset 0 1px 0 var(--highlight), 0 4px 12px var(--shadow-ambient), 0 24px 64px var(--shadow-key)"
# Cards and board panels (#282 Part 2a): a hairline ring, the top highlight and a soft key shadow.
card = "inset 0 1px 0 var(--highlight), 0 0 0 1px var(--hairline), 0 1px 2px var(--shadow-ambient), 0 6px 18px var(--shadow-ambient)"
# A failing board panel only: a ring in `failing` and a glow in `failing-glow`. A custom property's
# var() is resolved where it is declared (here, the root), so the state colours are named directly.
state = "inset 0 1px 0 var(--highlight), 0 0 0 1px var(--failing), 0 1px 2px var(--shadow-ambient), 0 8px 32px var(--failing-glow)"

# The materials' backdrop filter (header, menus, popovers, tooltips, the Inspector; VL-017).
[material]
filter = "blur(24px) saturate(180%)"

# Durations (ms) and easing. Reduced motion sets every duration to 0 ms.
[motion]
# Exits and control colour changes (#282).
quick = 100
fast = 150
standard = 250
# The Inspector opening (T25 §4.4).
float-open = 200
# A modal dialog zooming open from its origin, and closing back to it (#282).
zoom-open = 320
zoom-close = 200
easing-zoom = "cubic-bezier(0.16, 1, 0.3, 1)"
easing-out = "cubic-bezier(0.2, 0, 0, 1)"
easing-in = "cubic-bezier(0.4, 0, 1, 1)"
