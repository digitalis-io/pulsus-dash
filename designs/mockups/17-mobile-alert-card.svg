<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d">
<title id="t">Mobile Alert Lens card</title>
<desc id="d">The PWA Alert Lens card for INC-2041 opened from a push notification while offline. A hatched banner says the card is as of 12:23:41. The card shows severity, the impact line (4.1% of checkouts failing, about €38k/h at risk), an impact sparkline with the stale part hatched, the causal path to the probable origin psp-api, the changes, the RCA summary with evidence chips, and thumb-sized Ack and Escalate buttons with the offline queue note.</desc>
<defs>
<style>
text{font-family:Inter, system-ui, sans-serif;font-variant-numeric:tabular-nums;fill:#E6E8EB}
.m{font-family:JetBrains Mono, ui-monospace, monospace}
.mu{fill:#8A919C} .di{fill:#5C636E} .ac{fill:#5B9BFF}
.ok{fill:#2FB59A} .wa{fill:#D9C84A} .dg{fill:#E8923A} .fa{fill:#E0457B} .un{fill:#6B7280}
.b{font-weight:600} .sb{font-weight:500}
.s11{font-size:11.0px} .s12{font-size:12.0px} .s13{font-size:13.0px} .s16{font-size:16.0px} .s20{font-size:20.0px}
.hl{stroke:#FFFFFF14;stroke-width:1;fill:none}
.co{stroke:#5B9BFF;stroke-width:1.5;stroke-dasharray:4 3;fill:none}
</style>
