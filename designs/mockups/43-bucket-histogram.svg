<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Bucket histogram: request latency by version from histogram buckets on a log axis, overlaid with a CDF from cumulative counts, the tooltip open on the 0.005 to 0.01 bucket and the coverage meter popover open</title>
<desc id="d">Mockup 43 (T21 part 2a-ii, #206). Dark theme, 1440 by 900. The board release health with one histogram panel, Request latency by version, over checkout_request_seconds_bucket, an instant result. The le series form one family per version and pod; the shared bounds are 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5 and 1 seconds plus +Inf, one bin per bucket on a log value axis. Tick labels sit only at the true bounds, and the open last bucket ends at +∞ in the tertiary text colour. Versions are overlaid: v1 a solid 1.5 px step outline, v2 dashed, each over a 12 percent fill, with each version's CDF from cumulative counts on the right axis from 0 to 100 percent, exact at each upper bound. The pointer is on the 0.005 to 0.01 bin; the tooltip reads v1 310 of 500 and v2 190 of 260, v1 at or below 0.01: 62 percent, v2 at or below 0.01: 73 percent, and the footer Buckets at 12:00:00, median approximately 0.0088 (estimate). The coverage meter reads 120 in (minus infinity, 0.005] not shown (log) as a focused button and 1 families with different bounds not shown; the popover lists v1 and v2 with their counts in the open first bucket and the family with pod api-7 and version v2 with its missing shared bounds. No gradients or shadows on marks. Callouts: 1 CDF from cumulative counts, 2 true bounds and estimates, 3 dash channel, 4 one bin per bucket and the open end, 5 meter and popover.</desc>
