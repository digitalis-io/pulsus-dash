.mu{fill:#8A919C} .ac{fill:#5B9BFF}
.b{font-weight:600} .sb{font-weight:500}
.s11{font-size:11px} .s12{font-size:12px} .s13{font-size:13px} .s16{font-size:16px} .s20{font-size:20px}
