<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Application shell: sidebar with tenant switcher, Starred and Recent; page header with breadcrumb, title and star</title>
<desc id="d">The application shell approved on 2026-11-19 (D9, IA-016, IA-021, VL-017). A 240 px left sidebar: a 56 px top block with the product mark and the org and tenant switcher (Demo Org, Tenant: Demo with a menu chevron), aligned with the 56 px page header; the groups Boards (current), Explore with Metrics and Logs, Starred with three starred boards and Recent with three recent boards; a footer with Admin and the Collapse sidebar control. The page header shows the breadcrumb Boards, the title Service overview and an empty star toggle on the left, and on the right the time range trigger Last 1 hour with the absolute window 12:03 – 13:03 GMT (shown from a 1520 px viewport), the refresh split control with Refresh now and the auto-refresh interval 30s with a live dot, and the user menu avatar AA. The page body is empty, with its 24 px padding outlined. Callouts: 1 org and tenant switcher, 2 sidebar groups, 3 breadcrumb, title and star toggle, 4 time range and refresh, 5 user menu, 6 page padding.</desc>
