# dev/compose.yaml — local development and itests only. No IdP: authentication is deferred (D12).
# Driven by make dev-db, dev-up, dev-down, dev-reset and itest-local (docs/development/dev-stack.md).
# pulsus-fake stands in for PulsusDB (docs/development/testing-pulsusdb.md); it is built on first use.
# Trust authentication is for development only; the ports bind to loopback.
name: pulsus-dash
services:
  pg16:
    image: postgres:16.16-alpine3.24@sha256:1d5b02d3a9941fbd52437db4107f8c52d6297dac553ca1e5c299ebb3756b4857
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }      # loopback-only port below
    ports: ['127.0.0.1:${DEV_PG16_PORT:-55432}:5432']
    volumes:
      - pg16-data:/var/lib/postgresql/data
      - ../server/deploy/postgres-roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/20-database.sql:ro
    # Over TCP: the image's init-time server listens only on the Unix socket, so it never counts as
    # healthy; the check passes only after the init scripts ran and the real server started.
    healthcheck: { test: [CMD, pg_isready, -h, 127.0.0.1, -p, '5432', -U, postgres, -d, pulsus_dash], interval: 2s, timeout: 5s, retries: 30 }
  pg15:
    profiles: [itest]
    image: postgres:15.20-alpine3.24@sha256:e18480a22d6e48f4d816a6696769b1ec09ac73a824c5649e49c7d8b684913f3d
    environment: { POSTGRES_HOST_AUTH_METHOD: trust }
    ports: ['127.0.0.1:${DEV_PG15_PORT:-55433}:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck: { test: [CMD, pg_isready, -h, 127.0.0.1, -p, '5432', -U, postgres, -d, postgres], interval: 2s, timeout: 5s, retries: 30 }
  pulsus-fake:
    build: { context: .., dockerfile: dev/pulsus-fake.Dockerfile }
    ports: ['127.0.0.1:${DEV_PULSUS_FAKE_PORT:-59091}:9091']
    # No healthcheck: the image has no shell; up --wait waits for it to run.
volumes: { pg16-data: {} }
